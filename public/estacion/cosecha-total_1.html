<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosecha Total · Estación Fedor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --espacio:#0F1836;--espacio-hondo:#0A1028;--panel:#1A2650;--panel-claro:#243468;--borde:#070C1F;
  --cristal:#4FD8CB;--dorado:#FFC94D;--coral:#FF6B5E;--lila:#9B7BFF;--verde:#5BD672;--azulito:#9CCBFF;
  --hielo:#F2F6FF;--hielo-suave:#B9C4E8;
  --display:'Baloo 2',system-ui,sans-serif;--texto:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--texto);color:var(--hielo);background:var(--espacio-hondo);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--dorado);outline-offset:3px;border-radius:8px}
.pantalla{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;transition:opacity .35s ease,visibility .35s}
.pantalla.oculta{opacity:0;visibility:hidden;pointer-events:none}
#p-inicio,#p-fin{background:
  radial-gradient(1.6px 1.6px at 12% 18%,#fff 50%,transparent 51%),
  radial-gradient(1.7px 1.7px at 55% 8%,#FFD98A 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 84% 26%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 26% 76%,#A7E9E2 50%,transparent 51%),
  radial-gradient(ellipse at 50% -20%,#26377A 0%,var(--espacio) 55%,var(--espacio-hondo) 100%)}
.logo-juego{text-align:center;animation:flotarLogo 4s ease-in-out infinite}
@keyframes flotarLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.logo-juego h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,58px);margin:8px 0 0;line-height:.98;text-transform:uppercase;letter-spacing:-1px;
  background:linear-gradient(180deg,#C8F5A8,var(--verde) 45%,#2E8C46);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.logo-juego .sub{font-weight:800;letter-spacing:4px;font-size:clamp(10px,2vw,13px);color:var(--cristal);text-transform:uppercase}
.caja-inicio{margin-top:20px;display:grid;gap:14px;justify-items:center;width:min(560px,94vw)}
#in-nombre{width:min(340px,86vw);background:var(--espacio-hondo);border:3.5px solid var(--borde);border-radius:999px;color:var(--hielo);font-weight:800;font-size:16px;text-align:center;padding:12px 18px;box-shadow:inset 0 3px 8px rgba(0,0,0,.4)}
#in-nombre::placeholder{color:#5F6C99}
.bandas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.banda-btn{background:var(--panel-claro);border:3.5px solid var(--borde);border-radius:14px;padding:10px 16px;text-align:center;box-shadow:4px 4px 0 rgba(0,0,0,.42);transition:transform .12s ease}
.banda-btn:hover{transform:translateY(-3px)}
.banda-btn .g{font-family:var(--display);font-weight:800;font-size:16px;display:block}
.banda-btn .e{font-size:11px;font-weight:800;color:var(--hielo-suave)}
.banda-btn.on{background:var(--cristal);color:var(--espacio-hondo);box-shadow:4px 4px 0 rgba(0,0,0,.42),0 0 18px rgba(79,216,203,.5)}
.banda-btn.on .e{color:#0A3E38}
#btn-jugar{background:linear-gradient(180deg,#7FE394,var(--verde));color:#062A12;border:4px solid var(--borde);border-radius:999px;
  font-family:var(--display);font-weight:800;font-size:clamp(20px,4.4vw,28px);padding:14px 52px;box-shadow:0 7px 0 #2E7D42,0 12px 22px rgba(0,0,0,.5);transition:transform .12s ease}
#btn-jugar:hover{transform:translateY(-3px)}
#btn-jugar:active{transform:translateY(3px);box-shadow:0 2px 0 #2E7D42}
.nota-sonido{font-size:11.5px;font-weight:700;color:var(--hielo-suave)}

/* ── INVERNADERO ISOMÉTRICO ── */
#p-juego{padding:0;justify-content:flex-start}
#escena{position:relative;width:100%;height:100%;overflow:hidden;
  background:linear-gradient(180deg,#0B1533 0%,#122048 44%,#173A2C 62%,#122A20 100%)}
#domo{position:absolute;top:0;left:0;right:0;height:44%;pointer-events:none}
#campo{position:absolute;left:50%;top:52%;transform:translate(-50%,-46%);width:min(760px,96vw)}
#campo svg{width:100%;height:auto;display:block}
.parcela{cursor:pointer}
.parcela .aviso{transition:opacity .25s}
.parcela.atiende .marco{stroke:#FFC94D;stroke-width:4;filter:drop-shadow(0 0 10px rgba(255,201,77,.8))}
.parcela.lista .marco{stroke:#5BD672;stroke-width:4;filter:drop-shadow(0 0 10px rgba(91,214,114,.8))}
@keyframes brillar{0%,100%{opacity:.5}50%{opacity:1}}
.parcela.atiende .aviso,.parcela.lista .aviso{animation:brillar 1.1s ease-in-out infinite}
#camion{position:absolute;right:1%;bottom:6%;width:min(210px,26vw);transition:transform 1.1s cubic-bezier(.5,0,.8,.4)}
#camion.parte{transform:translateX(130%)}
#camion svg{width:100%;height:auto;display:block;filter:drop-shadow(4px 7px 0 rgba(0,0,0,.4))}
#carga-camion{position:absolute;top:12%;left:8%;width:52%;display:flex;flex-wrap:wrap;gap:2px;font-size:clamp(13px,2vw,19px)}
#panel-orden{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(620px,95vw);z-index:10;
  background:linear-gradient(180deg,var(--panel-claro),var(--panel));border:4px solid var(--borde);border-radius:18px;padding:12px 14px;
  box-shadow:0 0 0 2px rgba(79,216,203,.25),0 10px 24px rgba(0,0,0,.55)}
#preg-cos{font-family:var(--display);font-weight:800;font-size:clamp(15px,3.2vw,20px);text-align:center;margin:0 0 10px;min-height:1.3em}
#preg-cos .med{color:var(--cristal)}
#ops-cos{display:flex;gap:10px}
#ops-cos:empty::after{content:"👆 Toca una matera que brille para atenderla";display:block;width:100%;text-align:center;font-weight:800;color:var(--hielo-suave);font-size:13px;padding:6px 0}
.op-btn{flex:1;background:var(--espacio-hondo);border:3.5px solid var(--borde);border-radius:14px;font-family:var(--display);font-weight:800;font-size:clamp(17px,4vw,24px);color:var(--hielo);padding:12px 4px;box-shadow:0 5px 0 rgba(0,0,0,.5);transition:transform .1s ease}
.op-btn:hover{transform:translateY(-3px)}
.op-btn.bien{background:var(--verde);color:#062A12;animation:latir .4s ease}
.op-btn.mal{background:var(--coral);color:#fff;animation:sacudir .4s ease}
.op-btn.revela{outline:4px solid var(--verde);outline-offset:-4px}
@keyframes latir{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap;z-index:12}
.hud-chip{background:rgba(10,16,40,.88);border:3px solid var(--borde);border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;color:var(--hielo-suave)}
.hud-chip b{color:var(--hielo)}
.hud-chip.dorado b{color:var(--dorado)}
#hud-racha{background:linear-gradient(180deg,#FFE9AE,var(--dorado));color:#5C3A00;border:3px solid var(--borde);font-family:var(--display);font-size:13.5px;display:none}
#hud-racha.vivo{display:block;animation:latir .5s ease}
.hud-btn{background:rgba(10,16,40,.88);border:3px solid var(--borde);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:17px;color:var(--cristal);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
#tarjeta-pedido{position:absolute;left:12px;top:64px;z-index:11;background:rgba(10,16,40,.92);border:3.5px solid var(--borde);border-radius:14px;padding:10px 14px;min-width:170px;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
#tarjeta-pedido h4{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cristal);margin:0 0 6px}
#pedido-detalle{font-family:var(--display);font-weight:800;font-size:17px}
#pedido-detalle .avance{color:var(--dorado)}
#aviso-cos{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) rotate(-6deg);font-family:var(--display);font-weight:800;
  font-size:clamp(22px,6vw,44px);color:var(--dorado);text-shadow:3px 3px 0 var(--borde),0 0 26px rgba(255,201,77,.65);opacity:0;pointer-events:none;z-index:15}
#aviso-cos.vivo{animation:popAviso .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popAviso{0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1.12)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-72%) rotate(-6deg) scale(1)}}
#velo-pausa{position:fixed;inset:0;background:rgba(7,10,26,.82);display:grid;place-items:center;z-index:20}
#velo-pausa.oculta{display:none}
.panel-pausa{background:linear-gradient(180deg,var(--panel-claro),var(--panel));border:5px solid var(--borde);border-radius:20px;padding:26px 30px;text-align:center;box-shadow:10px 10px 0 rgba(0,0,0,.5)}
.panel-pausa h2{font-family:var(--display);margin:0 0 14px;font-size:24px}
.btn-grande{background:linear-gradient(180deg,#7FE394,var(--verde));color:#062A12;border:4px solid var(--borde);border-radius:999px;font-family:var(--display);font-weight:800;font-size:18px;padding:11px 34px;box-shadow:0 5px 0 #2E7D42;margin:4px}
.btn-secun{background:var(--espacio-hondo);color:var(--hielo-suave);border:3.5px solid var(--borde);border-radius:999px;font-family:var(--display);font-weight:800;font-size:15px;padding:10px 24px;box-shadow:0 4px 0 rgba(0,0,0,.5);margin:4px}
#titulo-fin{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,42px);margin:0 0 4px;text-align:center;
  background:linear-gradient(90deg,var(--cristal),var(--dorado));-webkit-background-clip:text;background-clip:text;color:transparent}
#sub-fin{font-weight:800;color:var(--hielo-suave);margin:0 0 16px;text-align:center}
#medalla-dia{font-size:clamp(52px,11vw,84px);margin-bottom:8px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4));animation:flotarLogo 3.5s ease-in-out infinite}
.stats{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;max-width:640px}
.stat-chip{background:rgba(10,16,40,.9);border:3px solid var(--borde);border-radius:999px;padding:7px 15px;font-weight:800;font-size:13px;color:var(--hielo-suave)}
.stat-chip b{color:var(--dorado)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<!-- ═══════ INICIO ═══════ -->
<section class="pantalla" id="p-inicio" aria-label="Inicio">
  <div class="logo-juego">
    <svg width="110" height="86" viewBox="0 0 110 86" aria-hidden="true">
      <path d="M10 66 a45 45 0 0 1 90 0 Z" fill="rgba(79,216,203,.16)" stroke="#4FD8CB" stroke-width="3.5"/>
      <path d="M30 66 v-14 M30 56 q-10 -2 -12 -12 q10 2 12 12 M30 52 q10 -2 12 -12 q-10 2 -12 12" stroke="#5BD672" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="62" cy="48" r="11" fill="#FFC94D" stroke="#070C1F" stroke-width="3"/>
      <path d="M62 60 v6" stroke="#5BD672" stroke-width="4" stroke-linecap="round"/>
      <text x="84" y="62" font-size="20" text-anchor="middle">🥕</text>
      <rect x="4" y="66" width="102" height="12" rx="6" fill="#5C3A1E" stroke="#070C1F" stroke-width="3.5"/>

    <span class="sub">Estación Fedor · Huerta Escolar</span>

    <input id="in-nombre" type="text" maxlength="24" placeholder="✏️ Escribe tu nombre, agricultor" autocomplete="off">
    <div class="bandas" role="group" aria-label="Elige tu nivel">
      <button class="banda-btn on" data-b="0"><span class="g">🌱 Semillita</span><span class="e">5–7 años · 1º</span></button>
      <button class="banda-btn" data-b="1"><span class="g">🌿 Agricultor</span><span class="e">7–9 años · 2º·3º</span></button>
      <button class="banda-btn" data-b="2"><span class="g">🌳 Ing. Agrónomo</span><span class="e">9–11 años · 4º·5º</span></button>
    </div>
    <button id="btn-jugar">▶ ¡A SEMBRAR!</button>
    <span class="nota-sonido">🔊 Al entrar al invernadero se enciende el sonido</span>

</section>

<!-- ═══════ INVERNADERO ═══════ -->
<section class="pantalla oculta" id="p-juego" aria-label="Invernadero">
  <div id="escena">
    <svg id="domo" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g fill="#F2F6FF" opacity=".85"><circle cx="80" cy="60" r="1.8"/><circle cx="240" cy="30" r="1.4"/><circle cx="420" cy="70" r="1.6"/><circle cx="640" cy="26" r="1.5"/><circle cx="820" cy="58" r="1.7"/><circle cx="930" cy="34" r="1.3"/></g>
      <circle cx="850" cy="70" r="34" fill="#B14ACD"/><circle cx="840" cy="60" r="11" fill="#8F35A8"/>
      <path d="M60 300 A 460 300 0 0 1 940 300" fill="rgba(79,216,203,.07)" stroke="#4FD8CB" stroke-width="3"/>
      <path d="M180 300 A 340 260 0 0 1 820 300" fill="none" stroke="rgba(79,216,203,.4)" stroke-width="2"/>
      <line x1="500" y1="14" x2="500" y2="300" stroke="rgba(79,216,203,.35)" stroke-width="2"/>
      <line x1="290" y1="82" x2="290" y2="300" stroke="rgba(79,216,203,.3)" stroke-width="2"/>
      <line x1="710" y1="82" x2="710" y2="300" stroke="rgba(79,216,203,.3)" stroke-width="2"/>
    </svg>
    <div id="campo"><svg id="svg-campo" viewBox="0 0 760 420" aria-hidden="false" role="group" aria-label="Materas del invernadero"></svg></div>
    <div id="camion">
      <svg viewBox="0 0 210 120" aria-hidden="true">
        <rect x="6" y="34" width="122" height="56" rx="8" fill="#FFC94D" stroke="#070C1F" stroke-width="4.5"/>
        <rect x="128" y="52" width="52" height="38" rx="7" fill="#4FD8CB" stroke="#070C1F" stroke-width="4.5"/>
        <rect x="138" y="60" width="24" height="16" rx="4" fill="#0A1028" stroke="#070C1F" stroke-width="3"/>
        <circle cx="42" cy="96" r="15" fill="#243468" stroke="#070C1F" stroke-width="4"/><circle cx="42" cy="96" r="6" fill="#9CCBFF"/>
        <circle cx="152" cy="96" r="15" fill="#243468" stroke="#070C1F" stroke-width="4"/><circle cx="152" cy="96" r="6" fill="#9CCBFF"/>
        <path d="M180 70 q16 0 18 14" fill="none" stroke="#070C1F" stroke-width="3.4"/>
      </svg>
      <div id="carga-camion"></div>
    </div>
    <div id="hud">
      <span class="hud-chip">👤 <b id="h-nombre">Agricultor</b></span>
      <span class="hud-chip">📦 Pedido <b id="h-pedido">1/3</b></span>
      <span class="hud-chip dorado">🥕 Cosechadas <b id="h-cosechas">0</b></span>
      <span class="hud-chip dorado">💎 <b id="h-puntos">0</b></span>
      <span class="hud-chip" id="hud-racha">RACHA ×<span id="h-racha">2</span></span>
      <span style="flex:1"></span>
      <button class="hud-btn" id="btn-sonido" aria-label="Sonido">🔊</button>

      <h4>📦 Pedido del Comando</h4>

    <div id="aviso-cos">🚚 ¡PEDIDO LISTO!</div>

      <button class="btn-grande" id="btn-seguir">▶ Seguir cultivando</button><br>
      <button class="btn-secun" id="btn-salir">🏠 Volver al inicio</button>
    </div>
  </div>
</section>

<!-- ═══════ FIN ═══════ -->
<section class="pantalla oculta" id="p-fin" aria-label="Resumen">
  <div id="medalla-dia">🥇</div>
  <h2 id="titulo-fin">¡Cosecha completa!</h2>
  <p id="sub-fin"></p>
  <div class="stats" id="stats-fin"></div>
  <div>
    <button class="btn-grande" id="btn-otro-dia">🔁 Nueva jornada</button>
    <button class="btn-secun" id="btn-cambiar">🎚️ Cambiar nivel</button>
  </div>
</section>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════
   COSECHA TOTAL · Juego 3 · Estación Fedor
   De la Huerta Escolar (libros de los 5 grados)
   Isométrico en tiempo real: sembrar, regar los mL exactos,
   cosechar a los cm pedidos, llenar el camión del Comando.
   ════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const az=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const elegir=a=>a[az(0,a.length-1)];
const mezclar=a=>{for(let i=a.length-1;i>0;i--){const j=az(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const MODO_PRUEBA=/(\?|&)test=1/.test(location.search);
const reducida=matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS="http://www.w3.org/2000/svg";

let actx=null, sonidoOn=true;
function armarAudio(){ if(actx)return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){actx=null;} }
function tono(f0,f1,dur,tipo,vol){
  if(!actx||!sonidoOn)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=tipo||"triangle";o.frequency.setValueAtTime(f0,actx.currentTime);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,actx.currentTime+dur);
    g.gain.setValueAtTime(vol||.15,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sClick=()=>tono(500,700,.08,"triangle",.1);
const sAgua=()=>{tono(900,500,.22,"sine",.13);setTimeout(()=>tono(760,420,.18,"sine",.1),90);};
const sCrece=()=>tono(520,1040,.25,"triangle",.14);
const sCosecha=()=>{tono(700,1050,.1,"triangle",.15);setTimeout(()=>tono(1050,1400,.14,"triangle",.14),80);};
const sMal=()=>tono(240,150,.25,"square",.12);
const sCamion=()=>{tono(160,240,.4,"sawtooth",.1);};
const sFanfarria=()=>{[[660,0],[880,110],[1100,220],[1320,330]].forEach(([f,d])=>setTimeout(()=>tono(f,f*1.2,.22,"triangle",.18),d));};
function emitir(tipo,datos){
  try{ if(window.parent!==window||MODO_PRUEBA) window.parent.postMessage(Object.assign({fuente:"cosecha-total",evento:tipo,ts:Date.now()},datos||{}),"*"); }catch(e){}
}

/* ════════ CULTIVOS Y PREGUNTAS (verificables) ════════ */
const CULTIVOS=[{e:"🥕",n:"zanahorias"},{e:"🍅",n:"tomates"},{e:"🥬",n:"lechugas"},{e:"🌽",n:"mazorcas"},{e:"🍓",n:"fresas"}];
function opciones(corr,paso){
  const set=new Set([corr]);
  for(const d of mezclar([paso,-paso,paso*2,-paso*2,paso*3])){ if(set.size>=3)break; const v=corr+d; if(v>0&&!set.has(v))set.add(v); }
  let k=1; while(set.size<3){ const v=corr+k*paso; if(v>0&&!set.has(v))set.add(v); else if(corr-k*paso>0)set.add(corr-k*paso); k++; }
  return mezclar([...set]);
}
/* pregunta de RIEGO: la matera pide mL exactos */
function genRiego(banda){
  if(banda===0){ const nec=az(2,5)*100, tiene=az(1,nec/100-1)*100;
    return {tipo:"riego",texto:"💧 La matera necesita <span class='med'>"+nec+" mL</span> y ya tiene <span class='med'>"+tiene+" mL</span>. ¿Cuántos mL le echas?",a:nec,b:tiene,corr:nec-tiene,ops:opciones(nec-tiene,100),unidad:"mL"}; }
  if(banda===1){ const nec=az(3,9)*100, tiene=az(1,nec/100-1)*100+50*az(0,1)*0;
    return {tipo:"riego",texto:"💧 Necesita <span class='med'>"+nec+" mL</span> y el tanque ya le puso <span class='med'>"+tiene+" mL</span>. ¿Cuántos mL faltan?",a:nec,b:tiene,corr:nec-tiene,ops:opciones(nec-tiene,50),unidad:"mL"}; }
  const veces=az(2,4), dosis=az(3,9)*50;
  return {tipo:"riego",texto:"💧 Lleva <span class='med'>"+veces+" riegos</span> de <span class='med'>"+dosis+" mL</span> cada uno. ¿Cuántos mL lleva en total?",a:veces,b:dosis,corr:veces*dosis,ops:opciones(veces*dosis,50),unidad:"mL"};
}
/* pregunta de COSECHA: llegar a los cm o contar la cosecha */
function genCosecha(banda,cultivo){
  if(banda===0){ const meta=az(8,20), va=az(3,meta-2);
    return {tipo:"cosecha",texto:"✂️ Debe medir <span class='med'>"+meta+" cm</span> y va en <span class='med'>"+va+" cm</span>. ¿Cuántos cm le faltan?",a:meta,b:va,corr:meta-va,ops:opciones(meta-va,1),unidad:"cm"}; }
  if(banda===1){ const matas=az(2,5), porMata=az(2,6);
    return {tipo:"cosecha",texto:"✂️ Hay <span class='med'>"+matas+" matas</span> y cada una da <span class='med'>"+porMata+" "+cultivo.n+"</span>. ¿Cuántas cosechas?",a:matas,b:porMata,corr:matas*porMata,ops:opciones(matas*porMata,1),unidad:""}; }
  const porMata=az(3,8), total=porMata*az(3,7);
  return {tipo:"cosecha",texto:"✂️ Necesitas <span class='med'>"+total+" "+cultivo.n+"</span> y cada mata da <span class='med'>"+porMata+"</span>. ¿Cuántas matas cosechas?",a:total,b:porMata,corr:total/porMata,ops:opciones(total/porMata,1),unidad:""};
}
if(MODO_PRUEBA)window.__gen={genRiego,genCosecha};
const PEDIDOS_JORNADA=3;
const COSECHA_POR_PLANTA=[2,4,6];   /* cuántas unidades aporta una planta cosechada */
const PEDIDO_TAMANO=[[4,6],[8,14],[12,22]];
</script>
<script>
"use strict";
/* ════════ ESTADO ════════ */
const C={
  nombre:"Agricultor", banda:0, activo:false, pausa:false,
  parcelas:[], pedidoIdx:0, pedido:null, entregadas:0,
  cosechadas:0, puntos:0, racha:0, mult:1, aciertos:0, intentos:0, mejorRacha:0,
  atendiendo:null, preg:null, _ult:0, riegos:0, mlTotales:0
};
if(MODO_PRUEBA)window.__C=C;
/* etapas: 0 tierra · 1 brote(espera) · 2 sedienta(pregunta riego) · 3 creciendo(espera) · 4 lista(pregunta cosecha) */
const T_BROTE=()=>MODO_PRUEBA?0.05:az(3,5);
const T_CRECE=()=>MODO_PRUEBA?0.05:az(4,6);

function irPantalla(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.add("oculta"));
  $(id).classList.remove("oculta");
}
document.querySelectorAll(".banda-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".banda-btn").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); C.banda=Number(b.dataset.b); sClick();
  });
});
$("#btn-jugar").addEventListener("click",()=>{
  armarAudio(); sClick();
  C.nombre=$("#in-nombre").value.trim()||"Agricultor";
  $("#h-nombre").textContent=C.nombre;
  abrirJornada();
});
$("#btn-otro-dia").addEventListener("click",()=>{sClick();abrirJornada();});
$("#btn-cambiar").addEventListener("click",()=>{sClick();irPantalla("#p-inicio");});
$("#btn-pausa").addEventListener("click",()=>{sClick();C.pausa=true;$("#velo-pausa").classList.remove("oculta");});
$("#btn-seguir").addEventListener("click",()=>{sClick();$("#velo-pausa").classList.add("oculta");C.pausa=false;C._ult=0;});
$("#btn-salir").addEventListener("click",()=>{sClick();$("#velo-pausa").classList.add("oculta");C.activo=false;irPantalla("#p-inicio");});
$("#btn-sonido").addEventListener("click",()=>{sonidoOn=!sonidoOn;$("#btn-sonido").textContent=sonidoOn?"🔊":"🔇";sClick();});
$("#btn-full").addEventListener("click",()=>{
  try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(e){}
});
addEventListener("keydown",e=>{
  if(!C.activo||C.pausa)return;
  const i={"1":0,"2":1,"3":2}[e.key];
  if(i!=null){const b=$("#ops-cos").children[i];if(b)b.click();}
});

/* ════════ JORNADA ════════ */
function abrirJornada(){
  Object.assign(C,{activo:true,pausa:false,pedidoIdx:0,entregadas:0,cosechadas:0,puntos:0,racha:0,mult:1,
    aciertos:0,intentos:0,mejorRacha:0,atendiendo:null,preg:null,_ult:0,riegos:0,mlTotales:0});
  C.parcelas=Array.from({length:6},(_,i)=>({i,etapa:0,reloj:0,cultivo:null}));
  $("#h-puntos").textContent="0";$("#h-cosechas").textContent="0";
  $("#hud-racha").classList.remove("vivo");
  $("#camion").classList.remove("parte");
  $("#carga-camion").innerHTML="";
  nuevoPedido();
  montarCampo();
  irPantalla("#p-juego");
  emitir("juego_iniciado",{banda:C.banda,nombre:C.nombre,pedidos:PEDIDOS_JORNADA});
  limpiarPregunta();
  requestAnimationFrame(cicloCampo);
}
function nuevoPedido(){
  const cult=elegir(CULTIVOS);
  const [mn,mx]=PEDIDO_TAMANO[C.banda];
  const paso=COSECHA_POR_PLANTA[C.banda];
  const cant=Math.max(paso,Math.round(az(mn,mx)/paso)*paso);
  C.pedido={cultivo:cult,cant,logrado:0};
  if(MODO_PRUEBA)window.__pedido=C.pedido;
  $("#h-pedido").textContent=(C.pedidoIdx+1)+"/"+PEDIDOS_JORNADA;
  pintarPedido();
}
function pintarPedido(){
  $("#pedido-detalle").innerHTML=C.pedido.cultivo.e+" "+C.pedido.cultivo.n+"<br><span class='avance'>"+C.pedido.logrado+" / "+C.pedido.cant+"</span>";
}

/* ════════ CAMPO ISOMÉTRICO ════════ */
const POS_PARC=[[190,120],[380,120],[570,120],[190,265],[380,265],[570,265]];
function montarCampo(){
  const svg=$("#svg-campo"); svg.innerHTML="";
  C.parcelas.forEach(p=>{
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","parcela");
    g.setAttribute("data-i",p.i);
    g.setAttribute("transform","translate("+POS_PARC[p.i][0]+" "+POS_PARC[p.i][1]+")");
    g.addEventListener("click",()=>tocarParcela(p.i));
    svg.append(g);
    pintarParcela(p.i);
  });
}
function pintarParcela(i){
  const p=C.parcelas[i];
  const g=$('#svg-campo .parcela[data-i="'+i+'"]');
  if(!g)return;
  let h='<path class="marco" d="M-80 0 L0 -46 L80 0 L0 46 Z" fill="#3A2A18" stroke="#070C1F" stroke-width="3.4"/>'
      +'<path d="M-80 0 v12 L0 58 v-12 Z" fill="#241A0E" stroke="#070C1F" stroke-width="3.4"/>'
      +'<path d="M80 0 v12 L0 58 v-12 Z" fill="#191108" stroke="#070C1F" stroke-width="3.4"/>';
  const cult=p.cultivo?p.cultivo.e:"";
  if(p.etapa===0){
    h+='<text y="8" text-anchor="middle" font-size="26" opacity=".6">🕳️</text>'
      +'<text class="aviso" y="-52" text-anchor="middle" font-size="20">🌰</text>';
  }
  if(p.etapa===1){
    h+='<path d="M0 30 v-16" stroke="#5BD672" stroke-width="4.5" stroke-linecap="round"/>'
      +'<path d="M0 18 q-7 -1 -9 -9 q7 1 9 9 Z" fill="#5BD672"/>'
      +'<ellipse cy="32" rx="15" ry="5" fill="rgba(0,0,0,.3)"/>';
  }
  if(p.etapa===2){
    h+='<path d="M0 30 v-24" stroke="#8AAE5C" stroke-width="4.5" stroke-linecap="round"/>'
      +'<path d="M0 12 q-9 -2 -11 -11 q9 2 11 11 Z" fill="#8AAE5C"/><path d="M0 6 q9 -2 11 -11 q-9 2 -11 11 Z" fill="#A5C46B"/>'
      +'<ellipse cy="32" rx="16" ry="5" fill="rgba(0,0,0,.3)"/>'
      +'<text class="aviso" y="-52" text-anchor="middle" font-size="22">💧</text>';
  }
  if(p.etapa===3){
    h+='<path d="M0 30 v-34" stroke="#5BD672" stroke-width="5" stroke-linecap="round"/>'
      +'<path d="M0 2 q-11 -2 -13 -13 q11 2 13 13 Z" fill="#5BD672"/><path d="M0 -6 q11 -2 13 -13 q-11 2 -13 13 Z" fill="#8FE8A5"/>'
      +'<ellipse cy="32" rx="17" ry="5.5" fill="rgba(0,0,0,.3)"/>'
      +'<text y="-14" text-anchor="middle" font-size="15" opacity=".85">'+cult+'</text>';
  }
  if(p.etapa===4){
    h+='<path d="M0 30 v-40" stroke="#3FAE5C" stroke-width="5.5" stroke-linecap="round"/>'
      +'<path d="M0 -4 q-12 -2 -14 -14 q12 2 14 14 Z" fill="#5BD672"/><path d="M0 -12 q12 -2 14 -14 q-12 2 -14 14 Z" fill="#8FE8A5"/>'
      +'<text y="-22" text-anchor="middle" font-size="26">'+cult+'</text>'
      +'<ellipse cy="32" rx="18" ry="6" fill="rgba(0,0,0,.3)"/>'
      +'<text class="aviso" y="-52" text-anchor="middle" font-size="22">✂️</text>';
  }
  g.innerHTML=h;
  g.classList.toggle("atiende",p.etapa===2||p.etapa===0);
  g.classList.toggle("lista",p.etapa===4);
}
function tocarParcela(i){
  if(!C.activo||C.pausa)return;
  const p=C.parcelas[i];
  if(C.atendiendo!=null&&C.atendiendo!==i){sClick();return;}
  if(p.etapa===0){                     /* sembrar: directo, sin pregunta */
    p.etapa=1;p.reloj=T_BROTE();p.cultivo=C.pedido.cultivo;
    sCrece();pintarParcela(i);
    emitir("siembra",{parcela:i});
    return;
  }
  if(p.etapa===2){ C.atendiendo=i; C.preg=genRiego(C.banda); mostrarPregunta(); }
  if(p.etapa===4){ C.atendiendo=i; C.preg=genCosecha(C.banda,p.cultivo); mostrarPregunta(); }
}
function limpiarPregunta(){
  $("#preg-cos").innerHTML="";
  $("#ops-cos").innerHTML="";
}
function mostrarPregunta(){
  const q=C.preg;
  if(MODO_PRUEBA)window.__corr=q.corr;
  $("#preg-cos").innerHTML=q.texto;
  const z=$("#ops-cos"); z.innerHTML="";
  q.ops.forEach(v=>{
    const b=el("button","op-btn",v+(q.unidad?" "+q.unidad:""));
    b.addEventListener("click",()=>{
      if(!C.activo||C.pausa||!C.preg)return;
      C.intentos++;
      [...z.children].forEach(x=>x.disabled=true);
      if(v===q.corr){
        C.aciertos++;C.racha++;C.mejorRacha=Math.max(C.mejorRacha,C.racha);
        C.mult=C.racha>=6?3:(C.racha>=3?2:1);
        if(C.mult>1){$("#hud-racha").classList.add("vivo");$("#h-racha").textContent=C.mult;}
        C.puntos+=10*C.mult;
        $("#h-puntos").textContent=C.puntos;
        b.classList.add("bien");
        emitir("respuesta",{correcta:true,tipo:q.tipo,racha:C.racha});
        setTimeout(()=>resolverAccion(), MODO_PRUEBA?10:340);
      }else{
        C.racha=0;C.mult=1;$("#hud-racha").classList.remove("vivo");
        b.classList.add("mal");sMal();
        [...z.children].find(x=>x.textContent===q.corr+(q.unidad?" "+q.unidad:"")).classList.add("revela");
        emitir("respuesta",{correcta:false,tipo:q.tipo,racha:0});
        setTimeout(()=>mostrarPregunta(), MODO_PRUEBA?10:1000);
      }
    });
    z.append(b);
  });
}
function resolverAccion(){
  const i=C.atendiendo, p=C.parcelas[i], q=C.preg;
  C.atendiendo=null;C.preg=null;
  limpiarPregunta();
  if(q.tipo==="riego"){
    sAgua();
    C.riegos++;C.mlTotales+=q.corr;
    p.etapa=3;p.reloj=T_CRECE();
    pintarParcela(i);
    emitir("riego",{parcela:i,ml:q.corr});
  }else{
    sCosecha();
    const gan=COSECHA_POR_PLANTA[C.banda];
    C.cosechadas+=gan;
    C.pedido.logrado=Math.min(C.pedido.cant,C.pedido.logrado+gan);
    $("#h-cosechas").textContent=C.cosechadas;
    for(let k=0;k<Math.min(gan,6);k++){const s=el("span",null,p.cultivo.e);$("#carga-camion").append(s);}
    p.etapa=0;p.cultivo=null;
    pintarParcela(i);
    pintarPedido();
    emitir("cosecha",{parcela:i,unidades:gan,pedido:C.pedidoIdx+1});
    if(C.pedido.logrado>=C.pedido.cant)despacharCamion();
  }
}
function despacharCamion(){
  C.puntos+=50;$("#h-puntos").textContent=C.puntos;
  const av=$("#aviso-cos");
  av.textContent="🚚 ¡PEDIDO "+(C.pedidoIdx+1)+" LISTO! +50 💎";
  av.classList.remove("vivo");void av.offsetWidth;av.classList.add("vivo");
  sCamion();
  $("#camion").classList.add("parte");
  emitir("pedido_entregado",{pedido:C.pedidoIdx+1,cultivo:C.pedido.cultivo.n,cantidad:C.pedido.cant});
  C.entregadas++;C.pedidoIdx++;
  setTimeout(()=>{
    $("#carga-camion").innerHTML="";
    $("#camion").classList.remove("parte");
    if(C.pedidoIdx>=PEDIDOS_JORNADA){cerrarJornada();}
    else nuevoPedido();
  }, MODO_PRUEBA?40:1300);
}
/* relojes de crecimiento */
function cicloCampo(ts){
  if($("#p-juego").classList.contains("oculta"))return;
  if(!C._ult)C._ult=ts;
  const dt=Math.min(.06,(ts-C._ult)/1000);C._ult=ts;
  if(C.activo&&!C.pausa){
    C.parcelas.forEach(p=>{
      if(p.etapa===1||p.etapa===3){
        p.reloj-=dt;
        if(p.reloj<=0){p.etapa=p.etapa===1?2:4;sCrece();pintarParcela(p.i);}
      }
    });
  }
  requestAnimationFrame(cicloCampo);
}
/* ════════ CIERRE ════════ */
function cerrarJornada(){
  C.activo=false;
  const prec=C.intentos?Math.round(100*C.aciertos/C.intentos):0;
  const perfecta=prec>=90;
  $("#medalla-dia").textContent=perfecta?"🥇":(prec>=70?"🥈":"🥉");
  $("#titulo-fin").textContent=perfecta?"¡Cosecha perfecta!":"¡Cosecha completa!";
  $("#sub-fin").textContent=C.nombre+", entregaste los "+PEDIDOS_JORNADA+" pedidos del Comando.";
  const st=$("#stats-fin"); st.innerHTML="";
  [["📦 Pedidos entregados",C.entregadas+" / "+PEDIDOS_JORNADA],
   ["🥕 Unidades cosechadas",C.cosechadas],
   ["💧 Riegos",C.riegos+" ("+C.mlTotales+" mL)"],
   ["🎯 Precisión",prec+"%"],
   ["🔥 Mejor racha",C.mejorRacha],
   ["💎 Puntos",C.puntos]].forEach(([k,v])=>{
    const c=el("span","stat-chip");c.innerHTML=k+": <b>"+v+"</b>";st.append(c);
  });
  sFanfarria();
  emitir("jornada_terminada",{nombre:C.nombre,banda:C.banda,pedidos:C.entregadas,cosechadas:C.cosechadas,
    riegos:C.riegos,ml:C.mlTotales,precision:prec,mejorRacha:C.mejorRacha,puntos:C.puntos});
  setTimeout(()=>irPantalla("#p-fin"), MODO_PRUEBA?30:700);
}
</script>
</body>
</html>
