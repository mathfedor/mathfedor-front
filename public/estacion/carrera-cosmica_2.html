<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrera Cósmica · Estación Fedor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --espacio:#0F1836;--espacio-hondo:#0A1028;--panel:#1A2650;--panel-claro:#243468;--borde:#070C1F;
  --cristal:#4FD8CB;--dorado:#FFC94D;--coral:#FF6B5E;--lila:#9B7BFF;--verde:#5BD672;--azulito:#9CCBFF;
  --hielo:#F2F6FF;--hielo-suave:#B9C4E8;
  --display:'Baloo 2',system-ui,sans-serif;--texto:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--texto);color:var(--hielo);background:var(--espacio-hondo);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--dorado);outline-offset:3px;border-radius:8px}
.pantalla{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;transition:opacity .35s ease,visibility .35s}
.pantalla.oculta{opacity:0;visibility:hidden;pointer-events:none}

/* ── INICIO ── */
#p-inicio{background:
  radial-gradient(1.6px 1.6px at 12% 18%,#fff 50%,transparent 51%),
  radial-gradient(1.7px 1.7px at 55% 8%,#FFD98A 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 84% 26%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 26% 76%,#A7E9E2 50%,transparent 51%),
  radial-gradient(1.6px 1.6px at 72% 88%,#C9B8FF 50%,transparent 51%),
  radial-gradient(ellipse at 50% -20%,#26377A 0%,var(--espacio) 55%,var(--espacio-hondo) 100%)}
.logo-juego{text-align:center;animation:flotarLogo 4s ease-in-out infinite}
@keyframes flotarLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.logo-juego .cohete-logo{font-size:0}
.logo-juego h1{
  font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,64px);margin:6px 0 0;line-height:.95;
  text-transform:uppercase;letter-spacing:-1px;
  background:linear-gradient(180deg,#FFE9AE,var(--dorado) 45%,#FF8A5C);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.45));
}
.logo-juego .sub{font-weight:800;letter-spacing:4px;font-size:clamp(10px,2vw,13px);color:var(--cristal);text-transform:uppercase}
.caja-inicio{margin-top:22px;display:grid;gap:14px;justify-items:center;width:min(560px,94vw)}
#in-nombre{width:min(340px,86vw);background:var(--espacio-hondo);border:3.5px solid var(--borde);border-radius:999px;color:var(--hielo);font-family:var(--texto);font-weight:800;font-size:16px;text-align:center;padding:12px 18px;box-shadow:inset 0 3px 8px rgba(0,0,0,.4)}
#in-nombre::placeholder{color:#5F6C99}
.bandas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.banda-btn{background:var(--panel-claro);border:3.5px solid var(--borde);border-radius:14px;padding:10px 16px;text-align:center;box-shadow:4px 4px 0 rgba(0,0,0,.42);transition:transform .12s ease}
.banda-btn:hover{transform:translateY(-3px)}
.banda-btn .g{font-family:var(--display);font-weight:800;font-size:16px;display:block}
.banda-btn .e{font-size:11px;font-weight:800;color:var(--hielo-suave)}
.banda-btn.on{background:var(--cristal);color:var(--espacio-hondo);box-shadow:4px 4px 0 rgba(0,0,0,.42),0 0 18px rgba(79,216,203,.5)}
.banda-btn.on .e{color:#0A3E38}
#btn-jugar{
  background:linear-gradient(180deg,#7FE394,var(--verde));color:#062A12;border:4px solid var(--borde);border-radius:999px;
  font-family:var(--display);font-weight:800;font-size:clamp(22px,4.6vw,30px);padding:14px 58px;letter-spacing:1px;
  box-shadow:0 7px 0 #2E7D42,0 12px 22px rgba(0,0,0,.5);transition:transform .12s ease,box-shadow .12s ease;
}
#btn-jugar:hover{transform:translateY(-3px)}
#btn-jugar:active{transform:translateY(3px);box-shadow:0 2px 0 #2E7D42}
.nota-sonido{font-size:11.5px;font-weight:700;color:var(--hielo-suave)}
.fedor-inicio{position:absolute;bottom:14px;right:16px;width:120px;opacity:.95;pointer-events:none}
@media(max-width:640px){.fedor-inicio{width:82px}}

/* ── JUEGO ── */
#p-juego{padding:0;justify-content:flex-start;background:var(--espacio-hondo)}
#marco-juego{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#lienzo{flex:1;width:100%;height:100%;display:block;background:#0B1230}
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap;z-index:5}
.hud-chip{background:rgba(10,16,40,.88);border:3px solid var(--borde);border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;color:var(--hielo-suave);backdrop-filter:blur(2px)}
.hud-chip b{color:var(--hielo)}
.hud-chip.dorado b{color:var(--dorado)}
#hud-combo{background:linear-gradient(180deg,#FFE9AE,var(--dorado));color:#5C3A00;border:3px solid var(--borde);font-family:var(--display);font-size:14px;display:none}
#hud-combo.vivo{display:block;animation:latirCombo .5s ease}
@keyframes latirCombo{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.hud-btn{background:rgba(10,16,40,.88);border:3px solid var(--borde);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:17px;color:var(--cristal);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.hud-btn:hover{transform:translateY(-2px)}
#barra-prog{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(520px,86vw);height:22px;background:rgba(10,16,40,.88);border:3px solid var(--borde);border-radius:999px;z-index:5}
#barra-prog .meta-b{position:absolute;right:-4px;top:-11px;font-size:17px}
.punto-nave{position:absolute;top:50%;font-size:15px;transform:translate(-50%,-52%);transition:left .3s linear;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.5))}
#panel-pregunta{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(640px,95vw);background:linear-gradient(180deg,var(--panel-claro),var(--panel));border:4px solid var(--borde);border-radius:18px;padding:12px 14px;z-index:6;box-shadow:0 0 0 2px rgba(79,216,203,.25),0 10px 24px rgba(0,0,0,.55)}
#zona-situ{font-family:var(--display);font-weight:800;font-size:clamp(15px,3.4vw,21px);text-align:center;margin:0 0 10px;line-height:1.25;min-height:1.3em}
#zona-situ .op{color:var(--dorado);font-size:1.25em}
#ops-carrera{display:flex;gap:10px}
.op-btn{flex:1;background:var(--espacio-hondo);border:3.5px solid var(--borde);border-radius:14px;font-family:var(--display);font-weight:800;font-size:clamp(19px,4.4vw,27px);color:var(--hielo);padding:12px 4px;box-shadow:0 5px 0 rgba(0,0,0,.5);transition:transform .1s ease}
.op-btn:hover{transform:translateY(-3px)}
.op-btn:active{transform:translateY(2px)}
.op-btn.bien{background:var(--verde);color:#062A12;animation:latirCombo .4s ease}
.op-btn.mal{background:var(--coral);color:#fff;animation:sacudirOp .4s ease}
.op-btn.revela{outline:4px solid var(--verde);outline-offset:-4px}
@keyframes sacudirOp{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#aviso-turbo{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-7deg);font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,52px);color:var(--dorado);text-shadow:3px 3px 0 var(--borde),0 0 26px rgba(255,201,77,.65);opacity:0;pointer-events:none;z-index:7}
#aviso-turbo.vivo{animation:turboPop .8s cubic-bezier(.2,.9,.3,1.3)}
@keyframes turboPop{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) rotate(-7deg) scale(1)}}
#cuenta-regresiva{position:absolute;inset:0;display:grid;place-items:center;z-index:9;pointer-events:none}
#cuenta-regresiva span{font-family:var(--display);font-weight:800;font-size:clamp(70px,20vw,150px);color:var(--dorado);text-shadow:4px 5px 0 var(--borde),0 0 40px rgba(255,201,77,.55)}
#cuenta-regresiva span.tic{animation:ticCuenta .86s ease both}
@keyframes ticCuenta{0%{transform:scale(2.1);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.75);opacity:0}}
#velo-pausa{position:fixed;inset:0;background:rgba(7,10,26,.82);display:grid;place-items:center;z-index:20}
#velo-pausa.oculta{display:none}
.panel-pausa{background:linear-gradient(180deg,var(--panel-claro),var(--panel));border:5px solid var(--borde);border-radius:20px;padding:26px 30px;text-align:center;box-shadow:10px 10px 0 rgba(0,0,0,.5)}
.panel-pausa h2{font-family:var(--display);margin:0 0 14px;font-size:24px}
.btn-grande{background:linear-gradient(180deg,#7FE394,var(--verde));color:#062A12;border:4px solid var(--borde);border-radius:999px;font-family:var(--display);font-weight:800;font-size:18px;padding:11px 34px;box-shadow:0 5px 0 #2E7D42;margin:4px}
.btn-secun{background:var(--espacio-hondo);color:var(--hielo-suave);border:3.5px solid var(--borde);border-radius:999px;font-family:var(--display);font-weight:800;font-size:15px;padding:10px 24px;box-shadow:0 4px 0 rgba(0,0,0,.5);margin:4px}

/* ── PODIO ── */
#p-podio{background:
  radial-gradient(1.6px 1.6px at 16% 22%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 78% 16%,#FFD98A 50%,transparent 51%),
  radial-gradient(ellipse at 50% -10%,#26377A 0%,var(--espacio) 55%,var(--espacio-hondo) 100%)}
#titulo-podio{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,44px);margin:0 0 4px;text-align:center;
  background:linear-gradient(90deg,var(--cristal),var(--dorado));-webkit-background-clip:text;background-clip:text;color:transparent}
#sub-podio{font-weight:800;color:var(--hielo-suave);margin:0 0 18px;text-align:center}
.escena-podio{perspective:900px;margin-bottom:16px}
#podio{display:flex;align-items:flex-end;gap:8px;transform:rotateX(14deg);transform-style:preserve-3d}
.pod-col{width:min(108px,24vw);text-align:center;transform-style:preserve-3d}
.pod-nave{font-size:34px;filter:drop-shadow(2px 4px 0 rgba(0,0,0,.45));margin-bottom:4px}
.pod-nom{font-weight:800;font-size:12px;color:var(--hielo-suave);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-caja{position:relative;border:4px solid var(--borde);border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:var(--espacio-hondo);box-shadow:0 14px 20px rgba(0,0,0,.45);transform-style:preserve-3d}
.pod-caja::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:rgba(0,0,0,.35);border-radius:0 0 8px 8px;transform:rotateX(-72deg);transform-origin:top}
.stats-podio{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;max-width:640px}
.stat-chip{background:rgba(10,16,40,.9);border:3px solid var(--borde);border-radius:999px;padding:7px 15px;font-weight:800;font-size:13px;color:var(--hielo-suave)}
.stat-chip b{color:var(--dorado)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<!-- ═══════ PANTALLA DE INICIO ═══════ -->
<section class="pantalla" id="p-inicio" aria-label="Inicio">
  <div class="logo-juego">
    <div class="cohete-logo">
      <svg width="120" height="86" viewBox="0 0 120 86" aria-hidden="true">
        <g transform="translate(60 40) rotate(-18)">
          <path d="M-34 0 l-16 -7 v14 Z" fill="#FFC94D" stroke="#070C1F" stroke-width="3"/>
          <path d="M-34 0 l-9 -4 v8 Z" fill="#FF6B5E"/>
          <ellipse cx="0" cy="0" rx="36" ry="17" fill="#FF8A5C" stroke="#070C1F" stroke-width="3.6"/>
          <circle cx="12" cy="-5" r="8.5" fill="#F2F6FF" stroke="#070C1F" stroke-width="2.6"/>
          <circle cx="10" cy="-6" r="2.6" fill="#123047"/><circle cx="15" cy="-6" r="2.6" fill="#123047"/>
          <path d="M8 -2 q4 3 9 0" stroke="#123047" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M-6 -16 l8 -9 6 3 -7 9 Z" fill="#FF6B5E" stroke="#070C1F" stroke-width="2.6"/>
        </g>
        <g stroke="#4FD8CB" stroke-width="3" stroke-linecap="round" opacity=".75">
          <line x1="6" y1="64" x2="26" y2="58"/><line x1="14" y1="74" x2="40" y2="66"/><line x1="30" y1="82" x2="48" y2="76"/>
        </g>
      </svg>
    </div>
    <h1>Carrera<br>Cósmica</h1>
    <span class="sub">Estación Fedor · Deporte y Números</span>
  </div>
  <div class="caja-inicio">
    <input id="in-nombre" type="text" maxlength="24" placeholder="✏️ Escribe tu nombre, piloto" autocomplete="off">
    <div class="bandas" role="group" aria-label="Elige tu nivel">
      <button class="banda-btn on" data-b="0"><span class="g">🌱 Cadete</span><span class="e">5–7 años · 1º</span></button>
      <button class="banda-btn" data-b="1"><span class="g">🚀 Piloto</span><span class="e">7–9 años · 2º·3º</span></button>
      <button class="banda-btn" data-b="2"><span class="g">☄️ Comandante</span><span class="e">9–11 años · 4º·5º</span></button>
    </div>
    <button id="btn-jugar">▶ ¡A CORRER!</button>
    <span class="nota-sonido">🔊 Al tocar el botón se enciende el sonido de la nave</span>
  </div>
  <svg class="fedor-inicio" viewBox="0 0 120 150" aria-hidden="true">
    <ellipse cx="60" cy="140" rx="34" ry="8" fill="rgba(0,0,0,.4)"/>
    <rect x="38" y="62" width="44" height="48" rx="14" fill="#FF8A5C" stroke="#070C1F" stroke-width="4"/>
    <rect x="48" y="72" width="24" height="16" rx="7" fill="#123047"/>
    <circle cx="60" cy="34" r="26" fill="#F4F7FF" stroke="#070C1F" stroke-width="4"/>
    <rect x="46" y="24" width="27" height="18" rx="9" fill="#123047"/>
    <circle cx="54" cy="33" r="3.4" fill="#4FD8CB"/><circle cx="66" cy="33" r="3.4" fill="#4FD8CB"/>
    <path d="M54 40 q6 5 12 0" stroke="#4FD8CB" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <line x1="60" y1="8" x2="60" y2="2" stroke="#070C1F" stroke-width="3.6"/><circle cx="60" cy="1" r="4" fill="#FFC94D" stroke="#070C1F" stroke-width="2.4"/>
    <line x1="38" y1="82" x2="18" y2="66" stroke="#B9C4E8" stroke-width="7" stroke-linecap="round"/>
    <line x1="82" y1="82" x2="102" y2="66" stroke="#B9C4E8" stroke-width="7" stroke-linecap="round"/>
    <line x1="50" y1="110" x2="46" y2="134" stroke="#9CB0D8" stroke-width="8" stroke-linecap="round"/>
    <line x1="70" y1="110" x2="74" y2="134" stroke="#9CB0D8" stroke-width="8" stroke-linecap="round"/>
    <path d="M14 62 a8 8 0 1 1 8 8" fill="none" stroke="#FFC94D" stroke-width="4" stroke-linecap="round"/>
  </svg>
</section>

<!-- ═══════ PANTALLA DE CARRERA ═══════ -->
<section class="pantalla oculta" id="p-juego" aria-label="Carrera">
  <div id="marco-juego">
    <canvas id="lienzo" width="960" height="540"></canvas>
    <div id="hud">
      <span class="hud-chip">👤 <b id="h-nombre">Piloto</b></span>
      <span class="hud-chip">🚀 <b id="h-vel">0</b> km/h</span>
      <span class="hud-chip dorado">💎 <b id="h-puntos">0</b></span>
      <span class="hud-chip" id="hud-combo">TURBO ×<span id="h-combo">2</span></span>
      <span style="flex:1"></span>
      <span class="hud-chip">⏱ <b id="h-tiempo">0:00</b></span>
      <button class="hud-btn" id="btn-sonido" aria-label="Sonido">🔊</button>
      <button class="hud-btn" id="btn-full" aria-label="Pantalla completa">⛶</button>
      <button class="hud-btn" id="btn-pausa" aria-label="Pausa">⏸</button>
    </div>
    <div id="barra-prog" aria-hidden="true"><span class="meta-b">🏁</span></div>
    <div id="aviso-turbo">¡TURBO ×2!</div>
    <div id="cuenta-regresiva" aria-hidden="true"></div>
    <div id="panel-pregunta">
      <p id="zona-situ"></p>
      <div id="ops-carrera"></div>
    </div>
  </div>
  <div id="velo-pausa" class="oculta">
    <div class="panel-pausa">
      <h2>⏸ Pausa</h2>
      <button class="btn-grande" id="btn-seguir">▶ Seguir corriendo</button><br>
      <button class="btn-secun" id="btn-salir-carrera">🏠 Volver al inicio</button>
    </div>
  </div>
</section>

<!-- ═══════ PANTALLA DE PODIO ═══════ -->
<section class="pantalla oculta" id="p-podio" aria-label="Resultados">
  <h2 id="titulo-podio">¡Carrera terminada!</h2>
  <p id="sub-podio"></p>
  <div class="escena-podio"><div id="podio"></div></div>
  <div class="stats-podio" id="stats-podio"></div>
  <div>
    <button class="btn-grande" id="btn-otra">🔁 Correr de nuevo</button>
    <button class="btn-secun" id="btn-cambiar">🎚️ Cambiar nivel</button>
  </div>
</section>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════
   CARRERA CÓSMICA · Juego 1 de la Estación Fedor
   Pseudo-3D de velocidad (Ruta R2) · situación primero, número después
   ════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const az=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const elegir=a=>a[az(0,a.length-1)];
const mezclar=a=>{for(let i=a.length-1;i>0;i--){const j=az(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const MODO_PRUEBA=/(\?|&)test=1/.test(location.search);
const reducida=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── sonido (se enciende con el primer toque, regla del navegador) ── */
let actx=null, sonidoOn=true;
function armarAudio(){ if(actx)return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){actx=null;} }
function tono(f0,f1,dur,tipo,vol){
  if(!actx||!sonidoOn)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=tipo||"triangle";o.frequency.setValueAtTime(f0,actx.currentTime);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,actx.currentTime+dur);
    g.gain.setValueAtTime(vol||.15,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sClick=()=>tono(500,700,.08,"triangle",.1);
const sBien=()=>{tono(560,840,.1,"triangle",.16);setTimeout(()=>tono(840,1120,.12,"triangle",.16),80);};
const sTurbo=()=>{tono(300,1400,.35,"sawtooth",.12);};
const sMal=()=>tono(240,150,.25,"square",.12);
const sTic=()=>tono(700,700,.09,"square",.14);
const sYa=()=>{tono(880,1320,.3,"triangle",.2);};
const sFanfarria=()=>{[[660,0],[880,110],[1100,220],[1320,330]].forEach(([f,d])=>setTimeout(()=>tono(f,f*1.2,.22,"triangle",.18),d));};

/* ── comunicación con la plataforma ── */
function emitir(tipo,datos){
  try{ if(window.parent!==window||MODO_PRUEBA) window.parent.postMessage(Object.assign({fuente:"carrera-cosmica",evento:tipo,ts:Date.now()},datos||{}),"*"); }catch(e){}
}

/* ════════ GENERADORES: situación primero, número después ════════
   Cada pregunta nace de una situación del mundo (impulso de la nave,
   cajas de estrellas, reparto entre pilotos) — nunca quiz en el vacío. */
function opciones(corr,desvios){
  const set=new Set([corr]);
  for(const d of mezclar(desvios.slice())){ if(set.size>=3)break; const v=corr+d; if(v>=0&&!set.has(v))set.add(v); }
  let k=1; while(set.size<3){ if(corr+k>=0&&!set.has(corr+k))set.add(corr+k); else if(corr-k>=0)set.add(corr-k); k++; }
  return mezclar([...set]);
}
function genB0(){ /* 5-7 · Cadete */
  const t=az(0,3);
  if(t===0){const a=az(2,9),b=az(1,10-Math.min(9,1)); const bb=az(1,Math.min(10,20-a)); return {a,b:bb,op:"+",situ:"⛽ Zona de impulso:",cuenta:a+" + "+bb,corr:a+bb,ops:opciones(a+bb,[1,-1,2,-2])};}
  if(t===1){const a=az(5,20),b=az(1,a-1); return {a,b,op:"-",situ:"☄️ Esquiva y descuenta:",cuenta:a+" − "+b,corr:a-b,ops:opciones(a-b,[1,-1,2,-2])};}
  if(t===2){const a=az(2,8),b=az(2,9); return {a,b,op:"+",situ:"Recoges "+a+" estrellas y luego "+b+" más. ¿Cuántas llevas?",cuenta:"",corr:a+b,ops:opciones(a+b,[1,-1,2])};}
  const a=az(6,15),b=az(1,5); return {a,b,op:"-",situ:"Tenías "+a+" cristales y gastas "+b+" en turbo. ¿Cuántos quedan?",cuenta:"",corr:a-b,ops:opciones(a-b,[1,-1,2])};
}
function genB1(){ /* 7-9 · Piloto */
  const t=az(0,3);
  if(t===0){const a=az(11,60),b=az(11,99-a); return {a,b,op:"+",situ:"⛽ Zona de impulso:",cuenta:a+" + "+b,corr:a+b,ops:opciones(a+b,[10,-10,1,-1])};}
  if(t===1){const a=az(30,99),b=az(11,a-10); return {a,b,op:"-",situ:"☄️ Esquiva y descuenta:",cuenta:a+" − "+b,corr:a-b,ops:opciones(a-b,[10,-10,1,-1])};}
  if(t===2){const a=az(2,5),b=az(2,10); return {a,b,op:"×",situ:"Cargas "+a+" cajas con "+b+" estrellas cada una. ¿Cuántas estrellas?",cuenta:"",corr:a*b,ops:opciones(a*b,[a,-a,b,-b])};}
  const b=az(2,5),c=az(2,9),a=b*c; return {a,b,op:"÷",situ:"Repartes "+a+" cristales entre "+b+" pilotos por igual. ¿Cuántos a cada uno?",cuenta:"",corr:c,ops:opciones(c,[1,-1,2,-2])};
}
function genB2(){ /* 9-11 · Comandante */
  const t=az(0,3);
  if(t===0){const a=az(3,9),b=az(3,9); return {a,b,op:"×",situ:"⛽ Turbo de tablas:",cuenta:a+" × "+b,corr:a*b,ops:opciones(a*b,[a,-a,b,-b,1,-1])};}
  if(t===1){const a=az(2,9)*10,b=az(3,9); return {a,b,op:"×",situ:"🛰️ Carga pesada:",cuenta:a+" × "+b,corr:a*b,ops:opciones(a*b,[10,-10,b*10,-b*10])};}
  if(t===2){const b=az(3,9),c=az(3,9),a=b*c; return {a,b,op:"÷",situ:"Repartes "+a+" litros de combustible entre "+b+" naves. ¿Litros por nave?",cuenta:"",corr:c,ops:opciones(c,[1,-1,2,-2])};}
  const a=az(120,480),b=az(110,990-a); return {a,b,op:"+",situ:"⛽ Impulso doble:",cuenta:a+" + "+b,corr:a+b,ops:opciones(a+b,[100,-100,10,-10])};
}
const GENERADORES=[genB0,genB1,genB2];
if(MODO_PRUEBA) window.__gen={genB0,genB1,genB2};
</script>
<script>
"use strict";
/* ════════ ESTADO DE LA CARRERA ════════ */
const META = 900;                      // metros estelares
const J = {
  nombre:"Piloto", banda:0, corriendo:false, pausa:false,
  dist:0, vel:0, t:0, puntos:0, combo:0, mult:1,
  correctas:0, total:0, mejorRacha:0,
  rivales:[], llegadas:[], preg:null, fin:false, curva:0
};
const RIVALES_BASE=[
  {nombre:"Vega",  color:"#9CCBFF", emoji:"🛸"},
  {nombre:"Orión", color:"#F5A3B8", emoji:"🚁"},
  {nombre:"Cometa",color:"#9B7BFF", emoji:"✈️"}
];
const VEL_RIVAL=[[46,58],[52,66],[58,74]];  // por banda: min,max m/s
const IMPULSO=[26,30,34];                   // empujón por respuesta correcta
const CRUCERO=[34,40,46];                   // velocidad que mantiene el jugador solo

/* ════════ PANTALLAS ════════ */
function irPantalla(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.add("oculta"));
  $(id).classList.remove("oculta");
}
document.querySelectorAll(".banda-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".banda-btn").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); J.banda=Number(b.dataset.b); sClick();
  });
});
$("#btn-jugar").addEventListener("click",()=>{
  armarAudio(); sClick();
  const n=$("#in-nombre").value.trim();
  J.nombre = n||"Piloto";
  $("#h-nombre").textContent=J.nombre;
  empezarCarrera();
});
$("#btn-otra").addEventListener("click",()=>{sClick();empezarCarrera();});
$("#btn-cambiar").addEventListener("click",()=>{sClick();irPantalla("#p-inicio");});
$("#btn-pausa").addEventListener("click",()=>{sClick();J.pausa=true;$("#velo-pausa").classList.remove("oculta");});
$("#btn-seguir").addEventListener("click",()=>{sClick();$("#velo-pausa").classList.add("oculta");J.pausa=false;J._ult=0;});
$("#btn-salir-carrera").addEventListener("click",()=>{sClick();$("#velo-pausa").classList.add("oculta");J.corriendo=false;irPantalla("#p-inicio");});
$("#btn-sonido").addEventListener("click",()=>{sonidoOn=!sonidoOn;$("#btn-sonido").textContent=sonidoOn?"🔊":"🔇";sClick();});
$("#btn-full").addEventListener("click",()=>{
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
});
addEventListener("keydown",e=>{
  if(!J.corriendo||J.pausa)return;
  const i={"1":0,"2":1,"3":2}[e.key];
  if(i!=null){const b=$("#ops-carrera").children[i];if(b)b.click();}
});

/* ════════ ARRANQUE Y CUENTA REGRESIVA ════════ */
function empezarCarrera(){
  Object.assign(J,{corriendo:false,pausa:false,dist:0,vel:0,t:0,puntos:0,combo:0,mult:1,correctas:0,total:0,mejorRacha:0,fin:false,curva:0,llegadas:[],_ult:0});
  const [v0,v1]=VEL_RIVAL[J.banda];
  J.rivales=RIVALES_BASE.map((r,i)=>({...r,dist:0,vel:v0+(v1-v0)*(i/2),osc:Math.random()*7,fin:null,carril:[-1,1,0][i]}));
  $("#h-puntos").textContent="0";$("#h-vel").textContent="0";$("#h-tiempo").textContent="0:00";
  $("#hud-combo").classList.remove("vivo");
  pintarBarraProgreso(true);
  irPantalla("#p-juego");
  ajustarLienzo();
  emitir("juego_iniciado",{banda:J.banda,nombre:J.nombre});
  const cz=$("#cuenta-regresiva"); cz.innerHTML="";
  const pasos=MODO_PRUEBA?["¡YA!"]:["3","2","1","¡YA!"];
  const dur=MODO_PRUEBA?60:860;
  pasos.forEach((p,i)=>{
    setTimeout(()=>{
      cz.innerHTML=""; const s=el("span","tic",p); cz.append(s);
      p==="¡YA!"?sYa():sTic();
      if(p==="¡YA!"){ setTimeout(()=>{cz.innerHTML="";J.corriendo=true;J._ult=0;nuevaPregunta();},dur*.7); }
    },i*dur);
  });
  requestAnimationFrame(cicloCarrera);
}

/* ════════ PREGUNTAS ════════ */
function nuevaPregunta(){
  const p=GENERADORES[J.banda]();
  J.preg=p;
  if(MODO_PRUEBA)window.__corr=p.corr;
  const z=$("#zona-situ");
  z.innerHTML="";
  z.append(document.createTextNode(p.situ+" "));
  if(p.cuenta){const s=el("span","op",p.cuenta+" = ?");z.append(s);}
  const ops=$("#ops-carrera"); ops.innerHTML="";
  p.ops.forEach(v=>{
    const b=el("button","op-btn",String(v));
    b.addEventListener("click",()=>responder(b,v));
    ops.append(b);
  });
}
function responder(btn,v){
  if(!J.corriendo||J.pausa||J.fin||!J.preg)return;
  const p=J.preg; J.preg=null; J.total++;
  const botones=[...$("#ops-carrera").children];
  botones.forEach(b=>b.disabled=true);
  if(v===p.corr){
    J.correctas++; J.combo++; J.mejorRacha=Math.max(J.mejorRacha,J.combo);
    J.mult=J.combo>=6?3:(J.combo>=3?2:1);
    const imp=IMPULSO[J.banda]*(J.mult===3?1.5:(J.mult===2?1.25:1));
    J.vel=Math.min(150,J.vel+imp);
    J.puntos+=10*J.mult;
    btn.classList.add("bien"); sBien();
    if(J.mult>1){
      const av=$("#aviso-turbo");
      av.textContent="¡TURBO ×"+J.mult+"!";
      av.classList.remove("vivo"); void av.offsetWidth; av.classList.add("vivo");
      $("#hud-combo").classList.add("vivo"); $("#h-combo").textContent=J.mult;
      sTurbo();
    }
    emitir("respuesta",{correcta:true,racha:J.combo,puntos:J.puntos});
    setTimeout(nuevaPregunta, MODO_PRUEBA?10:260);
  }else{
    J.combo=0; J.mult=1; $("#hud-combo").classList.remove("vivo");
    J.vel*=0.5;
    btn.classList.add("mal"); sMal();
    botones.find(b=>Number(b.textContent)===p.corr).classList.add("revela");
    emitir("respuesta",{correcta:false,racha:0,puntos:J.puntos});
    setTimeout(nuevaPregunta, MODO_PRUEBA?10:950);
  }
  $("#h-puntos").textContent=J.puntos;
}

/* ════════ CICLO DE CARRERA ════════ */
function cicloCarrera(ts){
  if(!$("#p-juego")||$("#p-juego").classList.contains("oculta"))return;
  if(!J._ult)J._ult=ts;
  const dt=Math.min(.05,(ts-J._ult)/1000); J._ult=ts;
  if(J.corriendo&&!J.pausa&&!J.fin){
    J.t+=dt;
    const cru=CRUCERO[J.banda];
    J.vel += (cru - J.vel)*dt*.35;           // tiende a crucero
    J.dist += J.vel*dt;
    J.curva = Math.sin(J.t*.5)*.7;
    J.rivales.forEach(r=>{
      const dif=r.dist-J.dist;
      let v=r.vel + Math.sin(J.t*.8+r.osc)*3;
      if(dif>130)v*=.9; if(dif<-130)v*=1.12;  // liga elástica: carrera siempre viva
      r.dist+=v*dt;
      if(r.dist>=META&&r.fin==null){r.fin=J.t;J.llegadas.push(r.nombre);}
    });
    if(J.dist>=META&&!J.fin){J.fin=true;J.llegadas.push(J.nombre);terminarCarrera();}
    $("#h-vel").textContent=Math.round(J.vel*4);
    const m=Math.floor(J.t/60),s=Math.floor(J.t%60);
    $("#h-tiempo").textContent=m+":"+String(s).padStart(2,"0");
    pintarBarraProgreso();
  }
  dibujar();
  requestAnimationFrame(cicloCarrera);
}
function pintarBarraProgreso(crear){
  const bar=$("#barra-prog");
  if(crear){bar.querySelectorAll(".punto-nave").forEach(p=>p.remove());
    [{e:"🚀",id:"yo"},...J.rivales.map((r,i)=>({e:r.emoji,id:"r"+i}))].forEach(o=>{
      const p=el("span","punto-nave",o.e);p.dataset.id=o.id;bar.append(p);
    });}
  const w=bar.clientWidth-26;
  bar.querySelectorAll(".punto-nave").forEach(p=>{
    const d=p.dataset.id==="yo"?J.dist:J.rivales[Number(p.dataset.id.slice(1))].dist;
    p.style.left=(8+Math.min(1,d/META)*w)+"px";
    p.style.zIndex=p.dataset.id==="yo"?3:2;
  });
}

/* ════════ DIBUJO PSEUDO-3D ════════ */
const cv=$("#lienzo"); let cx=null;
try{cx=cv.getContext("2d");}catch(e){}
function ajustarLienzo(){
  const r=$("#marco-juego").getBoundingClientRect();
  cv.width=Math.max(640,Math.floor(r.width));
  cv.height=Math.max(400,Math.floor(r.height));
}
addEventListener("resize",()=>{if(!$("#p-juego").classList.contains("oculta"))ajustarLienzo();});
function dibujar(){
  if(!cx)return;
  const W=cv.width,H=cv.height,HOR=H*.3;
  /* cielo */
  const g=cx.createLinearGradient(0,0,0,HOR);
  g.addColorStop(0,"#1B2A5E");g.addColorStop(1,"#0D1638");
  cx.fillStyle=g;cx.fillRect(0,0,W,HOR+2);
  cx.fillStyle="#F2F6FF";
  for(let i=0;i<26;i++){const x=(i*97+((i%3)*53))%W, y=(i*i*7)%HOR; cx.fillRect(x,y,i%4?1.6:2.2,i%4?1.6:2.2);}
  cx.fillStyle="#B14ACD";cx.beginPath();cx.arc(W*.84,HOR*.5,HOR*.2,0,7);cx.fill();
  cx.fillStyle="#8F35A8";cx.beginPath();cx.arc(W*.83,HOR*.44,HOR*.07,0,7);cx.fill();
  /* meta a la vista */
  const faltan=META-J.dist;
  if(faltan<160){
    const p=1-faltan/160, y=HOR-6, wB=40+p*W*.62;
    cx.save();cx.globalAlpha=.4+p*.6;
    cx.fillStyle="#F2F6FF";cx.fillRect(W/2-wB/2,y-14-p*26,wB,10+p*20);
    cx.fillStyle="#0A1028";
    const cs=Math.max(6,(10+p*20)/2);
    for(let x2=0;x2<wB;x2+=cs*2){cx.fillRect(W/2-wB/2+x2,y-14-p*26,cs,cs);cx.fillRect(W/2-wB/2+x2+cs,y-14-p*26+cs,cs,cs);}
    cx.restore();
  }
  /* pista que corre hacia ti */
  const centro=W/2 + J.curva*W*.06;
  for(let y=Math.floor(HOR);y<H;y++){
    const p=(y-HOR)/(H-HOR), per=Math.pow(p,1.55);
    const franja=Math.floor((per*16 + J.dist*.14)%2);
    cx.fillStyle=franja?"#101A3C":"#0B1230"; cx.fillRect(0,y,W,1);
    const cur=centro + J.curva*Math.pow(1-p,2)*W*.16;
    const ancho=W*.06+per*W*.94;
    cx.fillStyle=franja?"#232F60":"#1B2650"; cx.fillRect(cur-ancho/2,y,ancho,1);
    cx.fillStyle="#FFC94D"; cx.fillRect(cur-ancho/2-5,y,5,1); cx.fillRect(cur+ancho/2,y,5,1);
    if(franja===0){cx.fillStyle="#F2F6FF";cx.fillRect(cur-2.5,y,5,1);}
  }
  /* rivales visibles adelante */
  J.rivales.forEach(r=>{
    const z=r.dist-J.dist;
    if(z>2&&z<220){
      const per=1-z/220, pe=Math.pow(per,1.55);
      const y=HOR+pe*(H-HOR)*.86, esc=.14+pe*.9;
      const cur=centro + J.curva*Math.pow(1-pe,2)*W*.16;
      const x=cur + r.carril*(W*.055+pe*W*.15);
      cx.save();cx.translate(x,y);cx.scale(esc,esc);
      cx.fillStyle="rgba(0,0,0,.35)";cx.beginPath();cx.ellipse(0,26,40,10,0,0,7);cx.fill();
      cx.fillStyle=r.color;cx.strokeStyle="#070C1F";cx.lineWidth=4;
      cx.beginPath();cx.ellipse(0,0,42,19,0,0,7);cx.fill();cx.stroke();
      cx.fillStyle="#F2F6FF";cx.beginPath();cx.arc(10,-7,9,0,7);cx.fill();cx.stroke();
      cx.fillStyle="#123047";cx.beginPath();cx.arc(8,-8,2.6,0,7);cx.fill();cx.beginPath();cx.arc(14,-8,2.6,0,7);cx.fill();
      cx.fillStyle="#FFC94D";cx.beginPath();cx.moveTo(-42,-8);cx.lineTo(-64,0);cx.lineTo(-42,8);cx.closePath();cx.fill();
      cx.restore();
    }
  });
  /* tu cohete */
  const balanceo=reducida?0:Math.sin(J.t*9)*2.5;
  const px=W/2 - J.curva*W*.05, py=H-H*.14+balanceo;
  cx.save();cx.translate(px,py);cx.rotate(J.curva*.09);
  const escP=Math.min(1.25,W/760);
  cx.scale(escP,escP);
  cx.fillStyle="rgba(0,0,0,.4)";cx.beginPath();cx.ellipse(0,40,58,13,0,0,7);cx.fill();
  const fl=(J.vel/150)*46 + (reducida?0:Math.sin(J.t*22)*6);
  cx.fillStyle="#FFC94D";cx.beginPath();cx.moveTo(-56,-10);cx.lineTo(-56-fl-14,0);cx.lineTo(-56,10);cx.closePath();cx.fill();
  cx.fillStyle="#FF6B5E";cx.beginPath();cx.moveTo(-56,-5);cx.lineTo(-56-fl,0);cx.lineTo(-56,5);cx.closePath();cx.fill();
  if(J.mult>1){cx.strokeStyle="rgba(79,216,203,.75)";cx.lineWidth=3;
    for(let i=0;i<3;i++){cx.beginPath();cx.moveTo(-70-i*16,-16+i*4);cx.lineTo(-96-i*20,-16+i*4);cx.stroke();}}
  cx.fillStyle="#FF8A5C";cx.strokeStyle="#070C1F";cx.lineWidth=5;
  cx.beginPath();cx.ellipse(0,0,58,25,0,0,7);cx.fill();cx.stroke();
  cx.beginPath();cx.moveTo(-16,-22);cx.lineTo(-2,-40);cx.lineTo(10,-34);cx.lineTo(-2,-20);cx.closePath();
  cx.fillStyle="#FF6B5E";cx.fill();cx.stroke();
  cx.fillStyle="#F2F6FF";cx.beginPath();cx.arc(20,-8,13,0,7);cx.fill();cx.stroke();
  cx.fillStyle="#123047";cx.beginPath();cx.arc(16,-9,3.4,0,7);cx.fill();cx.beginPath();cx.arc(25,-9,3.4,0,7);cx.fill();
  cx.strokeStyle="#123047";cx.lineWidth=2.4;cx.beginPath();cx.arc(20,-5,5,0.15*Math.PI,0.85*Math.PI);cx.stroke();
  cx.restore();
}

/* ════════ FINAL Y PODIO ════════ */
function terminarCarrera(){
  J.corriendo=false;
  /* rivales que faltan: proyecta su llegada por velocidad para el orden final */
  J.rivales.filter(r=>r.fin==null).sort((a,b)=>b.dist-a.dist).forEach(r=>J.llegadas.push(r.nombre));
  const pos=J.llegadas.indexOf(J.nombre)+1;
  const bono=[0,200,120,60,30][pos]||0;
  J.puntos+=bono;
  const prec=J.total?Math.round(100*J.correctas/J.total):0;
  sFanfarria();
  $("#titulo-podio").textContent=["","🥇 ¡CAMPEÓN CÓSMICO!","🥈 ¡Gran carrera!","🥉 ¡Al podio!","🚀 ¡Buena carrera!"][pos];
  $("#sub-podio").textContent=J.nombre+", llegaste en el puesto "+pos+" de 4 · bono de meta +"+bono+" 💎";
  const podio=$("#podio"); podio.innerHTML="";
  const orden=[J.llegadas[1],J.llegadas[0],J.llegadas[2]];       // 2º · 1º · 3º
  const alturas=[86,120,64], colores=["#C7CFEA","#FFC94D","#D8905A"], nums=["2","1","3"];
  orden.forEach((nom,i)=>{
    if(!nom)return;
    const col=el("div","pod-col");
    const esJ=nom===J.nombre;
    const riv=J.rivales.find(r=>r.nombre===nom);
    col.append(el("div","pod-nave",esJ?"🚀":(riv?riv.emoji:"🛸")));
    col.append(el("div","pod-nom",esJ?nom+" (tú)":nom));
    const caja=el("div","pod-caja",nums[i]);
    caja.style.height=alturas[i]+"px";
    caja.style.background="linear-gradient(180deg,#FFFFFF33,"+colores[i]+")";
    caja.style.backgroundColor=colores[i];
    col.append(caja); podio.append(col);
  });
  const cuarto=J.llegadas[3];
  const st=$("#stats-podio"); st.innerHTML="";
  [["⏱ Tiempo",Math.floor(J.t/60)+":"+String(Math.floor(J.t%60)).padStart(2,"0")],
   ["✅ Impulsos correctos",J.correctas+" / "+J.total],
   ["🎯 Precisión",prec+"%"],
   ["🔥 Mejor racha",J.mejorRacha],
   ["💎 Puntos",J.puntos],
   ["4º puesto",cuarto||"—"]].forEach(([k,v])=>{
    const c=el("span","stat-chip");c.innerHTML=k+": <b>"+v+"</b>";st.append(c);
  });
  emitir("carrera_terminada",{nombre:J.nombre,banda:J.banda,posicion:pos,tiempo:Math.round(J.t),correctas:J.correctas,total:J.total,precision:prec,mejorRacha:J.mejorRacha,puntos:J.puntos});
  setTimeout(()=>irPantalla("#p-podio"), MODO_PRUEBA?30:900);
}
if(MODO_PRUEBA) window.__J=J;
</script>
